[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lareferencia-embedding-metadata"
version = "1.1.0"
description = "Prepare standalone bibliographic metadata packages for embeddings"
requires-python = ">=3.11,<3.13"
dependencies = ["fasttext==0.9.3", "numpy==1.26.4", "langcodes==3.5.0"]

[project.scripts]
prepare-embedding-metadata = "lareferencia_embedding_metadata.prepare:main"

[tool.setuptools]
packages = ["lareferencia_embedding_metadata"]
package-dir = {lareferencia_embedding_metadata = "."}
