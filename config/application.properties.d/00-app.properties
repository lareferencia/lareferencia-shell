# Spring Shell 3.x configuration
spring.shell.interactive.enabled=true
spring.shell.command.version.enabled=true
spring.shell.command.help.enabled=true

# Flowable remains a transitive core-library dependency, but the shell does not
# run its workflow engine or use Liquibase changelogs.
spring.liquibase.enabled=false

# Application configuration directory path
# Default: config
config.dir.path=config
